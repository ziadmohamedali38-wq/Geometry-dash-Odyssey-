<div id="game-container">
    <canvas id="gameCanvas" width="800" height="400" onclick="handleCanvasClick(event)"></canvas>

    <button id="auth-btn" onclick="unlockSystem()">Developer Login</button>

    <div id="editor-ui" style="display:none; flex-direction: column;">
        <div class="toolbar">
            <button onclick="selectedObject = 'block'">Block</button>
            <button onclick="selectedObject = 'spike'">Spike</button>
            <button onclick="saveToRTXD()">Upload to GDPS</button>
        </div>
        <p>Editor Active: Click canvas to place objects.</p>
    </div>
</div>

<script>
    // Bridge between HTML clicks and JS logic
    function handleCanvasClick(e) {
        const rect = e.target.getBoundingClientRect();
        placeObject(e.clientX - rect.left, e.clientY - rect.top);
    }
</script>
